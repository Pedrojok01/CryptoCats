[build]
  base = "nextjs_frontend/"
  publish = "out"
  command = "next build"

# Static export: no Next.js server function needed.
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "https://crypto-cats.netlify.app/*"
  to = "https://cryptocats.pedrojok.com/:splat"
  status = 301
  force = true
